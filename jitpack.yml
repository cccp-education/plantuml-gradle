# CNV-16 — JitPack build recipe (N2 plantuml-plugin).
before_install:
  - sdk install java 25.0.5.0+8-tem
  - sdk use java 25.0.5.0+8-tem
install:
  - ./gradlew -p plantuml-plugin publishToMavenLocal
env:
  # No GPG key on JitPack; the conventions publishing plugin skips signing
  # when CI=true (and plugin-publish therefore sees no signing plugin).
  CI: "true"
