name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# CNV-13.6 — the test wall-clock is split into exhaustive, disjoint shards that
# run on parallel runners (budget < 5 min). The local `check` shape is unchanged;
# kover binary reports are merged in the final `coverage` job.
env:
  CI: "true"

jobs:
  # ── Unit tests + lint (one fast job) ────────────────────────────────────────
  unit:
    name: Unit + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - name: Setup Gradle (shared cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-home-cache-includes: |
            caches
            wrapper
            testkit
      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh test` is the gate.
      - name: Unit tests + lint
        run: ci/run.sh test
      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-unit
          path: plantuml-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── functionalTest shards (2 parallel runners) ─────────────────────────────
  functional-shard:
    name: Functional · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "A"
            task: functionalTestShardA
          - name: "B"
            task: functionalTestShardB
    defaults:
      run:
        working-directory: plantuml-plugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle (shared cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-home-cache-includes: |
            caches
            wrapper
            testkit
      - name: Run functional shard
        run: ./gradlew ${{ matrix.task }}
      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-${{ matrix.task }}
          path: plantuml-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── BDD shards (7 parallel runners) ────────────────────────────────────────
  bdd-shard:
    name: BDD · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "a1-content"
            task: cucumberTestShardA1
          - name: "a2-empty"
            task: cucumberTestShardA2
          - name: "b-core"
            task: cucumberTestShardB
          - name: "c-i18n"
            task: cucumberTestShardC
          - name: "d-diagram"
            task: cucumberTestShardD
          - name: "e-repair"
            task: cucumberTestShardE
          - name: "f-rag"
            task: cucumberTestShardF
    defaults:
      run:
        working-directory: plantuml-plugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle (shared cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-home-cache-includes: |
            caches
            wrapper
            testkit
      # Only the RAG shard needs the pgvector image (testcontainers).
      - name: Cache pgvector testcontainers image
        if: matrix.task == 'cucumberTestShardF'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgvector-image.tar
          key: docker-pgvector-pg15-${{ runner.os }}
      - name: Load or pull the pgvector image
        if: matrix.task == 'cucumberTestShardF'
        shell: bash
        run: |
          set -euo pipefail
          tar="${{ runner.temp }}/pgvector-image.tar"
          if [ -f "$tar" ]; then
            echo "Restoring pgvector image from cache"
            docker load -i "$tar"
          else
            echo "Cache miss — pulling pgvector/pgvector:pg15"
            docker pull pgvector/pgvector:pg15
            docker save pgvector/pgvector:pg15 -o "$tar"
          fi
      - name: Run BDD shard
        run: ./gradlew ${{ matrix.task }}
      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-${{ matrix.task }}
          path: plantuml-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── Coverage merge (all binary reports) ────────────────────────────────────
  coverage:
    name: Coverage (merged)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, functional-shard, bdd-shard]
    defaults:
      run:
        working-directory: plantuml-plugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle (shared cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-home-cache-includes: |
            caches
            wrapper
            testkit
      - name: Download every coverage binary report
        uses: actions/download-artifact@v4
        with:
          pattern: kover-ic-*
          merge-multiple: true
          path: plantuml-plugin/build/kover/bin-reports
      - name: List merged binary reports
        run: ls -la build/kover/bin-reports
      - name: Verify merged coverage threshold
        run: >
          ./gradlew koverXmlReport koverThresholdCheck
          -x test -x functionalTest -x cucumberTest
          -x functionalTestShardA -x functionalTestShardB
          -x cucumberTestShardA1 -x cucumberTestShardA2 -x cucumberTestShardB
          -x cucumberTestShardC -x cucumberTestShardD -x cucumberTestShardE
          -x cucumberTestShardF
      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-merged-report
          path: plantuml-plugin/build/reports/kover/
          if-no-files-found: warn
